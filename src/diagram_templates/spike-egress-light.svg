<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 318" width="1040" role="img" aria-label="Requests reaching a host outside the allowlist: 16 with interception only, 13 with new tabs paused, 0 with the egress proxy.">
<defs><marker id="abf3989" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#bf3989" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a0969da" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a1a7f37" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#1a7f37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a9a6700" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#9a6700" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="acf222e" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#cf222e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a8c959f" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#8c959f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a656d76" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1.6 1.6L8.6 5L1.6 8.4" fill="none" stroke="#656d76" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0.5" y="0.5" width="1039" height="317" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" fill="#1f2328" text-anchor="start" font-weight="600">Requests that reached a host outside the allowlist</text><text x="40" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#656d76" text-anchor="start" font-weight="400">One run of the hostile fixture per configuration. Lower is better.</text><text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="500">Request interception only</text><text x="40" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="start" font-weight="400">13 WebSocket, 3 from a popup</text><rect x="388" y="118" width="560" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="388" y="118" width="560" height="24" rx="6" fill="#cf222e" fill-opacity="0.85"/><text x="964" y="136" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#cf222e" text-anchor="start" font-weight="700">16</text><text x="40" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="500">New tabs paused at creation</text><text x="40" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="start" font-weight="400">All WebSocket</text><rect x="388" y="170" width="560" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><rect x="388" y="170" width="455" height="24" rx="6" fill="#cf222e" fill-opacity="0.85"/><text x="964" y="188" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#cf222e" text-anchor="start" font-weight="700">13</text><text x="40" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2328" text-anchor="start" font-weight="500">Egress proxy added</text><text x="40" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="start" font-weight="400">Nothing leaves</text><rect x="388" y="222" width="560" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="964" y="240" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#1a7f37" text-anchor="start" font-weight="700">0</text><text x="40" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Browser request interception does not pause WebSocket connections, so the proxy is required.</text>
</svg>
