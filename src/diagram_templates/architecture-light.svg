<rect x="328" y="40" width="444" height="416" rx="12" fill="#eef1f4" stroke="#d0d7de" stroke-width="1.25"/><text x="348" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="600" letter-spacing="0.9">BROKER</text><text x="408" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">runs as separate system users</text><rect x="40" y="88" width="204" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/><text x="56" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#cf222e" text-anchor="start" font-weight="600" letter-spacing="0.9">UNTRUSTED</text><text x="56" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Agent</text><text x="56" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">May be prompt-injected</text><rect x="40" y="304" width="204" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/><text x="56" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="600" letter-spacing="0.9">OWNER</text><text x="56" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">You</text><text x="56" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Add logins, set policy</text><rect x="348" y="88" width="188" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/><text x="364" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="600" letter-spacing="0.9">FRONT DOOR</text><text x="364" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Gateway</text><text x="364" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Checks every request</text><rect x="564" y="88" width="188" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/><text x="580" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a7f37" text-anchor="start" font-weight="600" letter-spacing="0.9">LOGIN AND FILTER</text><text x="580" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Driver</text><text x="580" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Builds the filtered view</text><rect x="348" y="304" width="188" height="88" rx="10" fill="#f6f8fa" stroke="#bf3989" stroke-width="1.25"/><text x="364" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#bf3989" text-anchor="start" font-weight="600" letter-spacing="0.9">VAULT</text><text x="364" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Keeper</text><text x="364" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">One secret at a time</text><text x="564" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="600" letter-spacing="0.9">NEVER LEAVES THE BROKER</text><circle cx="568" cy="348" r="2.5" fill="#bf3989"/><text x="580" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">Passwords</text><circle cx="568" cy="372" r="2.5" fill="#bf3989"/><text x="580" y="377" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">TOTP seeds</text><circle cx="568" cy="396" r="2.5" fill="#bf3989"/><text x="580" y="401" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" text-anchor="start" font-weight="400">Cookies and tokens</text><rect x="816" y="88" width="184" height="88" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/><text x="832" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9a6700" text-anchor="start" font-weight="600" letter-spacing="0.9">SANDBOX</text><text x="832" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Browser</text><text x="832" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">One per session</text><rect x="816" y="206" width="184" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.25"/><text x="832" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Egress proxy</text><text x="832" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Allowlist, HTTPS only</text><rect x="816" y="304" width="184" height="88" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.25" stroke-dasharray="5 4"/><text x="832" y="328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="10.5" fill="#656d76" text-anchor="start" font-weight="600" letter-spacing="0.9">EXTERNAL</text><text x="832" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="start" font-weight="600">Website</text><text x="832" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Sees a normal login</text><path d="M286 40V456" stroke="#cf222e" stroke-width="1.4" stroke-dasharray="2 6" stroke-linecap="round"/><rect x="170.07" y="467" width="231.86" height="22" rx="11" fill="#ffffff" stroke="#cf222e" stroke-width="1.1"/><text x="286" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#cf222e" text-anchor="middle" font-weight="500">trust boundary: no secret crosses</text><path d="M244 116 L346 116" fill="none" stroke="#0969da" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a0969da)"/><rect x="262.53" y="105" width="64.94" height="22" rx="11" fill="#ffffff" stroke="#0969da" stroke-width="1.1"/><text x="295" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#0969da" text-anchor="middle" font-weight="500">actions</text><path d="M348 150 L246 150" fill="none" stroke="#0969da" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a0969da)"/><rect x="243.26999999999998" y="139" width="103.46000000000001" height="22" rx="11" fill="#ffffff" stroke="#0969da" stroke-width="1.1"/><text x="295" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#0969da" text-anchor="middle" font-weight="500">filtered view</text><path d="M538 132 L562 132" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a8c959f)" marker-start="url(#a8c959f)"/><path d="M244 348 L346 348" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a8c959f)"/><rect x="268.95" y="337" width="52.1" height="22" rx="11" fill="#ffffff" stroke="#656d76" stroke-width="1.1"/><text x="295" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="middle" font-weight="500">setup</text><path d="M442 304 L442 248 Q442 240 450 240 L650 240 Q658 240 658 232 L658 178" fill="none" stroke="#bf3989" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#abf3989)"/><rect x="475.8" y="229" width="148.4" height="22" rx="11" fill="#ffffff" stroke="#bf3989" stroke-width="1.1"/><text x="550" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#bf3989" text-anchor="middle" font-weight="500">one secret per login</text><path d="M752 132 L814 132" fill="none" stroke="#bf3989" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#abf3989)"/><path d="M908 176 L908 204" fill="none" stroke="#bf3989" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#abf3989)"/><path d="M908 272 L908 302" fill="none" stroke="#bf3989" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#abf3989)"/><path d="M40 520H76" stroke="#0969da" stroke-width="1.8" stroke-linecap="round"/><text x="86" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">What the agent sends and sees</text><path d="M309.9375 520H345.9375" stroke="#bf3989" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5"/><text x="355.9375" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Path a secret travels</text><path d="M526.375 520H562.375" stroke="#8c959f" stroke-width="1.8" stroke-linecap="round"/><text x="572.375" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76" text-anchor="start" font-weight="400">Out of band</text>
