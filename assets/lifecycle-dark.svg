ion Mono', monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400">status  close</text><rect x="40" y="290" width="176" height="78" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.4"/><text x="128" y="324" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#e6edf3" text-anchor="middle" font-weight="600">login_failed</text><text x="128" y="346" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400">status</text><rect x="852" y="46" width="148" height="46" rx="12" fill="#161b22" stroke="#4b5868" stroke-width="1.4"/><text x="926" y="75" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">closed</text><text x="926" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">session.close</text><path d="M792 149 L814 149 Q822 149 822 141 L822 77 Q822 69 830 69 L850 69" fill="none" stroke="#4b5868" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a4b5868)"/><rect x="852" y="138" width="148" height="46" rx="12" fill="#161b22" stroke="#4b5868" stroke-width="1.4"/><text x="926" y="167" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">expired</text><text x="926" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">lifetime or idle limit</text><path d="M792 149 L816 149 Q822 149 822 155 L822 155 Q822 161 828 161 L850 161" fill="none" stroke="#4b5868" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a4b5868)"/><rect x="852" y="230" width="148" height="46" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.4"/><text x="926" y="259" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">revoked</text><text x="926" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">owner or policy change</text><path d="M792 149 L814 149 Q822 149 822 157 L822 245 Q822 253 830 253 L850 253" fill="none" stroke="#4b5868" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a4b5868)"/><rect x="852" y="322" width="148" height="46" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.4"/><text x="926" y="351" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">killed</text><text x="926" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">tripwire or circuit breaker</text><path d="M792 149 L814 149 Q822 149 822 157 L822 337 Q822 345 830 345 L850 345" fill="none" stroke="#4b5868" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a4b5868)"/><path d="M216 149 L298 149" fill="none" stroke="#4b5868" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a4b5868)"/><rect x="230.95" y="138" width="52.1" height="22" rx="11" fill="#0d1117" stroke="#8b949e" stroke-width="1.1"/><text x="257" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="500">ready</text><path d="M476 149 L558 149" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" marker-end="url(#a3fb950)"/><rect x="487.74" y="138" width="58.52" height="22" rx="11" fill="#0d1117" stroke="#3fb950" stroke-width="1.1"/><text x="517" y="153" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle" font-weight="500">unseal</text><text x="517" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle" font-weight="400">the only way in</text><path d="M352 188 L352 288" fill="none" stroke="#d29922" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ad29922)"/><rect x="306.69" y="227" width="90.62" height="22" rx="11" fill="#0d1117" stroke="#d29922" stroke-width="1.1"/><text x="352" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#d29922" text-anchor="middle" font-weight="500">code needed</text><path d="M424 290 L424 190" fill="none" stroke="#d29922" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ad29922)"/><rect x="392.27" y="251" width="103.46000000000001" height="22" rx="11" fill="#0d1117" stroke="#d29922" stroke-width="1.1"/><text x="444" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#d29922" text-anchor="middle" font-weight="500">owner attends</text><path d="M300 172 L266 172 Q258 172 258 180 L258 304 Q258 312 250 312 L218 312" fill="none" stroke="#f85149" stroke-width="1.6" stroke-linecap="round" marker-end="url(#af85149)"/><rect x="231.95" y="215" width="52.1" height="22" rx="11" fill="#0d1117" stroke="#f85149" stroke-width="1.1"/><text x="258" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#f85149" text-anchor="middle" font-weight="500">error</text><path d="M300 346 L218 346" fill="none" stroke="#f85149" stroke-width="1.6" stroke-linecap="round" marker-end="url(#af85149)"/><rect x="226.53" y="335" width="64.94" height="22" rx="11" fill="#0d1117" stroke="#f85149" stroke-width="1.1"/><text x="259" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#f85149" text-anchor="middle" font-weight="500">timeout</text><text x="40" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="start" font-weight="400">The second line of each state lists the methods the agent may call. Anything else is refused.</text><text x="40" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="start" font-weight="400">Revoke reaches every live state. Sessions are not resumed after a crash.</text>
</svg>
